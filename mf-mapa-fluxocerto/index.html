<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MF · Mapa do FluxoCerto</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: faixa de comando no topo, indicadores em linha; abaixo, paleta | chão de fábrica | painel de dados */
  --floor:#e7ebf0; --ink:#18212d; --muted:#5b6878; --panel:#ffffff; --line:#cdd5de;
  --accent:#f2b705; --steel:#2c4a6e; --bad:#d23b2a; --good:#178a5a;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--floor);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
.wrap{height:100vh;min-height:620px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between;
  border-bottom:4px solid var(--ink);padding-bottom:10px;position:relative}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:4px;
  background:repeating-linear-gradient(135deg,var(--accent) 0 12px,var(--ink) 12px 24px)}
h1{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;margin:0;letter-spacing:.5px;text-transform:uppercase;text-wrap:balance}
.tag{display:inline-block;vertical-align:middle;margin-left:8px;font-size:14px;letter-spacing:.6px;background:var(--accent);color:var(--ink);padding:2px 8px;border-radius:3px}
.tag[hidden]{display:none}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;border:2px solid var(--ink);border-radius:4px;overflow:hidden}
button{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.4px;text-transform:uppercase;
  border:2px solid var(--ink);background:var(--panel);color:var(--ink);padding:5px 11px;border-radius:4px;cursor:pointer}
.seg button{border:0;border-radius:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--accent)}
button:hover{background:#f5f7f9}
.seg button[aria-pressed="true"]:hover{background:var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.42;cursor:not-allowed}
.sv{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.4px;text-transform:uppercase;border:2px solid var(--ink);background:var(--panel);color:var(--ink);padding:5px 6px;border-radius:4px;cursor:pointer}
.livre{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.livre[hidden]{display:none}
.livre label{display:flex;align-items:center;gap:5px}
.livre input{width:90px;accent-color:var(--ink)}
#bBal[aria-pressed="true"]{background:var(--ink);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--steel);border-radius:3px;padding:6px 10px}
.kpi.hot{border-left-color:var(--bad)} .kpi.ok{border-left-color:var(--good)}
.kpi b{display:block;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi small{font-size:14px;font-weight:500;color:var(--muted);font-family:var(--body)}
.kpi i{font-style:normal}
.state{margin:0;font-size:15px}
.state strong{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.4px;margin-right:6px}
.state em{font-style:normal;color:var(--bad);font-weight:600}
.work{flex:1;min-height:0;display:grid;grid-template-columns:158px minmax(0,1fr) 294px;gap:10px}
body.apresentar .work{grid-template-columns:minmax(0,1fr)}
body.apresentar .pal,body.apresentar .side,body.apresentar .soEd{display:none}
.pal,.side{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:auto;min-height:0}
.pal{padding:7px 8px;display:flex;flex-direction:column;gap:3px}
.pal h2,.side h2{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.5px;margin:0 0 2px}
.pal h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:3px 0 0;font-weight:600}
.pc{display:flex;align-items:center;gap:7px;width:100%;text-align:left;font-size:14px;padding:2px 6px;border-width:1.5px;touch-action:none;user-select:none;cursor:grab}
.pc i{flex:none;width:13px;height:13px;border-radius:2px;border:1px solid rgba(24,33,45,.5)}
.pc[aria-pressed="true"]{background:var(--ink);color:var(--accent)}
.pal p{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.35}
.side{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.side .sec{display:flex;flex-direction:column;gap:7px}
.side .sec+.sec{border-top:1px solid var(--line);padding-top:10px}
.side .arq{margin-top:auto}
.fld{display:flex;flex-direction:column;gap:2px}
.fld label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.fld input,.fld select,textarea{font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:3px;padding:4px 7px;width:100%}
.fld input:focus,.fld select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.leit{font-size:13.5px;background:#f3f5f8;border-left:4px solid var(--steel);padding:5px 8px;margin:0;border-radius:2px}
.leit.bad{border-left-color:var(--bad);color:#8f2317}
.gi{font-size:13px;line-height:1.35;border-left:4px solid var(--line);padding:3px 8px;background:#f3f5f8;border-radius:2px}
.gi.ok{border-left-color:var(--good)}
.gi b{display:block;font-weight:600}
.gi span{color:var(--muted)}
.guia{display:flex;flex-direction:column;gap:5px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:17px;height:17px;accent-color:var(--good)}
.nota{font-size:12.5px;color:var(--muted);margin:0;line-height:1.4}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{font-size:14.5px;padding:4px 9px;border-width:1.5px}
button.perigo{border-color:var(--bad);color:var(--bad)}
.lst{display:flex;flex-direction:column;gap:4px}
.lst button{text-transform:none;font-family:var(--body);font-size:13px;font-weight:500;letter-spacing:0;text-align:left;border-width:1px;border-color:var(--line);padding:4px 7px}
.stage{position:relative;min-height:0;background:linear-gradient(#f3f5f8,#dfe5eb);border:1px solid var(--line);border-radius:4px;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hint{position:absolute;left:10px;bottom:8px;right:10px;width:fit-content;font-size:12px;color:var(--muted);background:rgba(255,255,255,.8);padding:2px 8px;border-radius:3px;pointer-events:none}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:min(92%,560px);background:var(--ink);color:#fff;font-size:14px;padding:8px 14px;border-radius:4px;border-left:6px solid var(--accent);box-shadow:0 4px 14px rgba(24,33,45,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toast.erro{border-left-color:var(--bad)}
.pop{position:absolute;z-index:3;width:300px;background:#fff;border:2px solid var(--ink);border-top:6px solid var(--accent);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;box-shadow:0 8px 24px rgba(24,33,45,.3)}
.pop[hidden]{display:none}
.pop h2{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.5px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:7px}
.legend svg{flex:none}
dialog{border:2px solid var(--ink);border-radius:5px;padding:16px;width:min(640px,92vw);color:var(--ink);font-family:var(--body)}
dialog::backdrop{background:rgba(24,33,45,.45)}
dialog h2{font-family:var(--display);text-transform:uppercase;margin:0 0 4px;font-size:22px}
dialog p{margin:0 0 8px;font-size:14px;color:var(--muted)}
dialog textarea{height:220px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;resize:vertical}
dialog .btns{margin-top:10px;justify-content:flex-end}
#dlgErro{color:var(--bad);font-weight:600;min-height:1.2em;margin:6px 0 0}
@media (max-width:900px){
  .wrap{height:auto}
  .work{grid-template-columns:minmax(0,1fr)}
  .stage{height:62vh;min-height:380px}
  .pal{flex-direction:row;flex-wrap:wrap}
  .pal h2,.pal h3,.pal p{width:100%}
  .pc{width:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div>
      <h1>MF · Mapa do FluxoCerto<span class="tag" id="tagEx" hidden>Exemplo</span></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="ctl">
      <div class="seg" role="group" aria-label="Modo de trabalho">
        <button id="bEdit" aria-pressed="true">Editar</button>
        <button id="bShow" aria-pressed="false">Apresentar</button>
      </div>
      <div class="seg" role="group" aria-label="Estado do mapa">
        <button id="bCur" aria-pressed="true">Estado atual</button>
        <button id="bFut" aria-pressed="false">Estado futuro</button>
      </div>
      <button id="bUndo" class="soEd" title="Desfazer (Ctrl+Z)">Desfazer</button>
      <button id="bRedo" class="soEd" title="Refazer (Ctrl+Y)">Refazer</button>
      <button id="bBal" aria-pressed="true" title="Mostrar ou ocultar os balões de dados dos postos">Balões</button>
      <button id="bPause">Pausar</button>
      <button id="bOut" aria-label="Diminuir zoom">−</button>
      <button id="bIn" aria-label="Aumentar zoom">+</button>
      <button id="bFit" title="Enquadrar o mapa inteiro">Enquadrar</button>
      <select id="selVista" class="sv" aria-label="Vista da câmera" title="Vista da câmera">
        <option value="superior">Vista superior</option><option value="inclinada">Vista inclinada</option>
        <option value="isometrica">Vista isométrica</option><option value="livre">Câmera livre</option>
      </select>
      <span id="livre" class="livre" hidden>
        <label>Giro <input type="range" id="rGiro" min="0" max="90" step="1"></label>
        <label>Inclinação <input type="range" id="rIncl" min="20" max="90" step="1"></label>
      </span>
    </div>
  </header>

  <section class="kpis" aria-label="Indicadores">
    <div class="kpi"><span>Demanda</span><b><i id="vDem"></i> <small>pç/dia</small></b></div>
    <div class="kpi"><span>Tempo disponível</span><b><i id="vDisp"></i> <small>min/dia</small></b></div>
    <div class="kpi"><span>Takt time</span><b><i id="vTakt"></i> <small>s</small></b></div>
    <div class="kpi hot" id="kLead"><span id="lLead">Lead time</span><b><i id="vLead"></i> <small>dias</small></b></div>
    <div class="kpi"><span id="lTav">Tempo de agregação</span><b><i id="vTav"></i> <small>s</small></b></div>
    <div class="kpi"><span id="lEff">Eficiência do fluxo</span><b><i id="vEff"></i> <small>%</small></b></div>
  </section>

  <p class="state" id="stateTxt"></p>

  <div class="work">
    <aside class="pal" id="pal" aria-label="Paleta de peças"></aside>
    <div class="stage" id="stage">
      <canvas id="cv" role="img" aria-label="Mapa de fluxo de valor isométrico animado: fornecedor, controle da produção e cliente, postos de trabalho com estoques entre eles e a linha do tempo na frente."></canvas>
      <div class="hint" id="hint"></div>
      <div class="pop" id="pop" hidden role="dialog" aria-label="Dados do posto"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <aside class="side" id="side" aria-label="Dados da peça selecionada"></aside>
  </div>

</div>

<dialog id="dlg" aria-labelledby="dlgT">
  <h2 id="dlgT"></h2>
  <p id="dlgP"></p>
  <textarea id="dlgTa" spellcheck="false" aria-label="Mapa em JSON"></textarea>
  <p id="dlgErro" role="alert"></p>
  <div class="btns">
    <button id="dlgOk">Carregar mapa</button>
    <button id="dlgX">Fechar</button>
  </div>
</dialog>

<script>
(function(){
"use strict";

/* =========================================================================
   1. MODELO  -  todo o mapa vive em um único objeto JSON (variável M)
   ========================================================================= */
var CHAVE="fluxocerto.mf.mapa.v1", VERSAO=2;
var INK="#18212d", CRU="#66768a", AZUL="#1f6fd6";

/* catálogo de estações: cor, altura de apoio da peça, cor da peça na saída */
var CAT={
  laser:   {rotulo:"Corte laser",nome:"CORTE LASER",cor:"#2f6fb5",tz:1.3,saida:"#9fb0bf",wx:2.6,acena:false},
  dobra:   {rotulo:"Dobra",      nome:"DOBRA",      cor:"#7a5bd0",tz:1.5,saida:"#a9b8c6",wx:2.9,acena:true},
  solda:   {rotulo:"Solda",      nome:"SOLDA",      cor:"#d9542b",tz:1.2,saida:"#8696a6",wx:2.6,acena:true},
  pintura: {rotulo:"Pintura",    nome:"PINTURA",    cor:"#1d9a8a",tz:1.5,saida:"#e8792b",wx:2.6,acena:false},
  montagem:{rotulo:"Montagem",   nome:"MONTAGEM",   cor:"#c98a12",tz:1.3,saida:null,     wx:2.6,acena:true},
  usinagem:{rotulo:"Usinagem",   nome:"USINAGEM",   cor:"#4f8a3c",tz:1.4,saida:"#b9c6d2",wx:2.6,acena:false},
  inspecao:{rotulo:"Inspeção",   nome:"INSPEÇÃO",   cor:"#b0457a",tz:1.3,saida:null,     wx:2.6,acena:false},
  generico:{rotulo:"Genérico",   nome:"PROCESSO",   cor:"#5f6f82",tz:1.3,saida:null,     wx:2.6,acena:false},
  /* trabalho de terceiros, feito fora do parque fabril */
  terceiro:{rotulo:"Terceiros (externo)",nome:"TERCEIROS",cor:"#8a5a2b",tz:.75,saida:null,wx:2.9,acena:false,externo:true}
};
var MODELOS=["laser","dobra","solda","pintura","montagem","usinagem","inspecao","generico","terceiro"];
/* tipo de demanda informada pelo cliente: rótulo, dias trabalhados no período, unidade */
var TIPOS_DEMANDA={diaria:["Diária",1,"pç/dia"],semanal:["Semanal",5,"pç/semana"],mensal:["Mensal",22,"pç/mês"],anual:["Anual",250,"pç/ano"]};
var CORES_AREA={azul:["Azul","#2f6fb5"],verde:["Verde","#178a5a"],amarelo:["Amarelo","#c98a12"],vermelho:["Vermelho","#d23b2a"],cinza:["Cinza","#5f6f82"],roxo:["Roxo","#7a5bd0"]};
/* pe: pegada no chão relativa à posição [x0,y0,x1,y1]; alt: altura do volume para seleção */
var TIPOS={
  processo:  {rotulo:"Posto de trabalho",     pe:[-3.5,-4,3.5,4],     alt:4.6, cor:"#5f6f82"},
  fornecedor:{rotulo:"Fornecedor",            pe:[-3,-3,3,3],         alt:5.8, cor:"#55606e"},
  cliente:   {rotulo:"Cliente",               pe:[-3,-3,3,3],         alt:5.8, cor:"#55606e"},
  pcp:       {rotulo:"Controle da produção",  pe:[-4.3,-3.3,4.3,3.3], alt:5.4, cor:"#2c4a6e"}
};
/* tipos de fluxo de material entre processos */
var FLUXOS={empurrado:{rotulo:"Empurrado"},supermercado:{rotulo:"Puxado com supermercado (kanban)"},fifo:{rotulo:"FIFO (primeiro a entrar, primeiro a sair)"},continuo:{rotulo:"Fluxo contínuo (sem estoque)"}};
var VERDE="#178a5a";
var TIPOS_INFO={eletronica:"Eletrônica",manual:"Manual"};

function num(v,def,min,max){
  var n=typeof v==="number"?v:parseFloat(String(v==null?"":v).replace(",","."));
  if(!isFinite(n))n=def; if(min!=null&&n<min)n=min; if(max!=null&&n>max)n=max; return n;
}
function txt(v,def){return typeof v==="string"?v.slice(0,120):(typeof v==="number"?String(v):def);}
function hoje(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}

function dadosProcesso(d,modelo){
  d=d||{};
  var r=d.refugo;
  return {nome:txt(d.nome,CAT[modelo].nome),tc:num(d.tc,60,0),tr:num(d.tr,0,0),disp:num(d.disp,100,0,100),
    op:Math.round(num(d.op,1,0,99)),tempoDisp:num(d.tempoDisp,27600,0),lote:txt(d.lote,""),lotePecas:Math.round(num(d.lotePecas,0,0)),kaizen:txt(d.kaizen,""),
    refugo:(r==null||r==="")?null:num(r,0,0,100)};
}
function mapaVazio(){
  return {versao:VERSAO,exemplo:false,
    mapa:{nome:"Novo mapa",familia:"",clienteFinal:"",data:hoje()},
    cliente:{demandaDia:0,tipoDemanda:"diaria",demanda:0,diasPeriodo:1,turnos:1,tempoDisponivelMin:480,freqExpedicao:"diária"},
    areas:[],
    fornecedor:{material:"",freqEntrega:"semanal"},
    nos:[],ligacoes:[],fluxosInfo:[],futuro:null};
}
function mapaExemplo(){
  var P=function(id,modelo,x,tc,tr,disp,op){return {id:id,tipo:"processo",modelo:modelo,pos:{x:x,y:22},
    dados:dadosProcesso({tc:tc,tr:tr,disp:disp,op:op,tempoDisp:27600,lote:"1 semana",lotePecas:2300},modelo)};};
  var L=function(id,a,b,q){return {id:id,origem:a,destino:b,fluxo:"empurrado",estoquePecas:q,percentual:100};};
  var I=function(id,a,b,r,f,t){return {id:id,origem:a,destino:b,rotulo:r,frequencia:f,tipo:t};};
  var ex={versao:VERSAO,exemplo:true,
    mapa:{nome:"Suporte metálico SM-200",familia:"Suportes metálicos",clienteFinal:"Linha metalmecânica fictícia, dados de demonstração",data:hoje()},
    cliente:{demandaDia:460,tipoDemanda:"diaria",demanda:460,diasPeriodo:1,turnos:1,tempoDisponivelMin:460,freqExpedicao:"entrega diária"},
    areas:[],
    fornecedor:{material:"Chapa de aço",freqEntrega:"2× por semana"},
    nos:[
      {id:"n1",tipo:"fornecedor",pos:{x:4,y:-11}},
      {id:"n2",tipo:"pcp",pos:{x:36,y:-11},dados:{nome:"PCP",descricao:"Controle da produção, MRP"}},
      {id:"n3",tipo:"cliente",pos:{x:68,y:-11}},
      P("n4","laser",10,38,15,90,1),P("n5","dobra",23,52,25,95,1),P("n6","solda",36,72,10,85,2),
      P("n7","pintura",49,45,30,90,1),P("n8","montagem",62,58,0,100,2)],
    ligacoes:[L("l1","n1","n4",2300),L("l2","n4","n5",920),L("l3","n5","n6",1380),L("l4","n6","n7",460),L("l5","n7","n8",690),L("l6","n8","n3",1150)],
    fluxosInfo:[
      I("i1","n3","n2","Pedidos","diários","eletronica"),
      I("i2","n2","n1","Pedido","semanal","eletronica"),
      I("i3","n2","n4","Programação","semanal","manual"),I("i4","n2","n5","Programação","semanal","manual"),
      I("i5","n2","n6","Programação","semanal","manual"),I("i6","n2","n7","Programação","semanal","manual"),
      I("i7","n2","n8","Programação","semanal","manual")],futuro:null};
  /* estado futuro de demonstração: supermercados com kanban, montagem como puxador e dois kaizens */
  var F=estadoFuturoDe(ex),dias=[2,.5,.5,.5,.5,1];
  F.ligacoes.forEach(function(l,k){l.fluxo="supermercado";l.estoquePecas=dias[k]*460;});
  F.nos.forEach(function(n){
    if(n.id==="n5"){n.dados.tr=10;n.dados.kaizen="Troca rápida: 25 para 10 min";}
    if(n.id==="n6"){n.dados.tc=56;n.dados.disp=92;n.dados.kaizen="T/C de 72 para 56 s";}
    if(n.id==="n8")n.puxador=true;
    if(n.tipo==="processo"){n.dados.lote="1 dia";n.dados.lotePecas=460;}
  });
  F.fluxosInfo=F.fluxosInfo.filter(function(f){return !/^i[3-6]$/.test(f.id);});
  F.fluxosInfo[F.fluxosInfo.length-1].frequencia="diária";
  F.plano={pecasEmbalagem:20,nivelamento:true};
  ex.futuro=F; return ex;
}
/* o estado futuro nasce como cópia do atual */
function estadoFuturoDe(D){
  var c=JSON.parse(JSON.stringify({nos:D.nos,ligacoes:D.ligacoes,fluxosInfo:D.fluxosInfo}));
  c.plano={pecasEmbalagem:null,nivelamento:false}; return c;
}

/* um posto pode ter várias saídas e várias entradas; só ciclos e ligações repetidas são recusados */

  if(A.tipo==="cliente")return "O cliente é o fim do fluxo: ele só recebe material.";

/* cria ligação de material ou fluxo de informação; devolve {erro} ou {sel} */
function ligar(M,a,b){

/* mantém o id original quando é válido e ainda não foi usado */

function normEstado(M,o){

  o.nos.forEach(function(n){
    if(!n||typeof n!=="object"||!TIPOS[n.tipo])return;
    var id=String(n.id||""); if(!/^n\d+$/.test(id)||vistos[id])return;
    if(n.tipo!=="processo"){if(unico[n.tipo])return;unico[n.tipo]=1;}

  });
}

function unit(dx,dy){var l=Math.hypot(dx,dy);return l<1e-6?[1,0]:[dx/l,dy/l];}

function ateBorda(pe,d){

/* rota do caminhão entre a fábrica F e o estoque K, em trechos retos */
function rotaCaminhao(F,K){

    if((b[1]-a[1])*s<.5)return [b,b];

  }
  s=dx>=0?1:-1; a=[F.x+s*5.5,F.y]; b=[K.x-s*4,K.y];
  if((b[0]-a[0])*s<.5)return [b,b];

}
function zigue(a,b){

/* produção do posto: considera T/C, T/R por lote, disponibilidade, refugo, tempo disponível e operadores */
function producao(d){

/* contorno da união de retângulos de layout que se tocam e têm a mesma cor */
function unirAreas(areas){
  var n=areas.length,pai=[],i,j,grupos={},res=[];
  function raiz(k){while(pai[k]!==k)k=pai[k]=pai[pai[k]];return k;}
  for(i=0;i<n;i++)pai[i]=i;
  for(i=0;i<n;i++)for(j=i+1;j<n;j++){var a=areas[i],b=areas[j]; if(a.cor!==b.cor)continue;
    var ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x),oy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y);

    function K(x,y){return (x+50000)*100000+(y+50000);}
    g.forEach(function(a){for(x=a.x;x<a.x+a.w;x++)for(y=a.y;y<a.y+a.h;y++)cel[K(x,y)]=1;});
    g.forEach(function(a){for(x=a.x;x<a.x+a.w;x++)for(y=a.y;y<a.y+a.h;y++){
      if(cel[K(x,y)]!==1)continue; cel[K(x,y)]=2;

      if(!cel[K(x-1,y)])segs.push([x,y,x,y+1]); if(!cel[K(x+1,y)])segs.push([x+1,y,x+1,y+1]);}});

  });

function calcular(M){

}

/* ---- persistência ---- */
function salvar(){
  try{localStorage.setItem(CHAVE,JSON.stringify(D));}
  catch(e){ if(!avisouSalvar){avisouSalvar=true;avisar("Não foi possível salvar no navegador. Use Copiar mapa (JSON) para guardar o trabalho.",true);} }
}
function carregar(){
  try{var s=localStorage.getItem(CHAVE); if(s)return normalizar(JSON.parse(s));}catch(e){}
  return null;
}
function alterou(){
  rev++; clearTimeout(salvarTmr); salvarTmr=setTimeout(salvar,250); atualizarUI();
}

/* ---- histórico ---- */
function fotografar(){pilhaU.push(JSON.stringify(D)); if(pilhaU.length>150)pilhaU.shift(); pilhaR.length=0;}
function acao(fn){fotografar();ultChave=null;fn();alterou();}
function editar(chave,fn){ if(ultChave!==chave){fotografar();ultChave=chave;} fn(); alterou(); }
function restaurar(de,para){
  if(!de.length)return;
  fecharPop(); para.push(JSON.stringify(D)); D=JSON.parse(de.pop()); ultChave=null; atualizarVista();
  if(sel&&!alvo(sel))sel=null;
  alterou(); montarPainel();
}
function desfazer(){restaurar(pilhaU,pilhaR);}

function alvo(s){return s.tipo==="no"?noPorId(M,s.id):s.tipo==="lig"?ligPorId(M,s.id):s.tipo==="area"?areaPorId(M,s.id):infoPorId(M,s.id);}

/* ---- câmera ---- */
function enquadrar(){
  var C=calc(),p=C.piso,pts=[[p[0],p[1],0],[p[2],p[1],0],[p[2],p[3],0],[p[0],p[3],0]],a=[1e9,1e9,-1e9,-1e9];

  pts.forEach(function(q){var u=q[0]*AX-q[1]*AY,v=q[0]*BX+q[1]*BY-q[2]*ZS; if(u<a[0])a[0]=u; if(v<a[1])a[1]=v; if(u>a[2])a[2]=u; if(v>a[3])a[3]=v;});
  vis={cx:(a[0]+a[2])/2,cy:(a[1]+a[3])/2,w:a[2]-a[0]+2,h:a[3]-a[1]+2};

}
function darZoom(f,mx,my){
  var z=Math.max(.5,Math.min(5,zoom*f)); if(z===zoom)return;
  cam();var ux=(mx-OX)/S,uy=(my-OY)/S; zoom=z;
  var s2=Math.min(W/vis.w,H/vis.h)*zoom; panX=mx-ux*s2-W/2+vis.cx*s2; panY=my-uy*s2-H/2+vis.cy*s2;
}

/* ---- localização de peças sob o ponteiro ---- */
function dentroPoli(pl,x,y){
  for(var i=0,j=pl.length-1,c=false;i<pl.length;j=i++){
    if((pl[i][1]>y)!==(pl[j][1]>y)&&x<(pl[j][0]-pl[i][0])*(y-pl[i][1])/(pl[j][1]-pl[i][1])+pl[i][0])c=!c;
  }
  return c;
}
function hexVolume(r,h){return [P(r[0],r[3],0),P(r[2],r[3],0),P(r[2],r[1],0),P(r[2],r[1],h),P(r[0],r[1],h),P(r[0],r[3],h)];}
function distSeg(x,y,a,b){
  var dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy,u=l?Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/l)):0;
  return Math.hypot(x-a[0]-dx*u,y-a[1]-dy*u);
}
function noEm(x,y,ignorar){
  var best=null,bd=-1e9;
  M.nos.forEach(function(n){ if(n.id===ignorar)return;
    if(dentroPoli(hexVolume(retNo(n),TIPOS[n.tipo].alt),x,y)){var d=n.pos.x+n.pos.y; if(d>bd){bd=d;best=n;}} });
  return best;
}
function porta(n,qual){var r=retNo(n);return qual==="s"?[r[2]+.8,n.pos.y]:[r[0]-.8,n.pos.y];}
/* pontos de saída: o PCP tem três, para o lado do cliente, para o fornecedor e para a produção */
function portas(n){var r=retNo(n),l=[porta(n,"s")]; if(n.tipo==="pcp"){l.push([r[0]-.8,n.pos.y]);l.push([n.pos.x,r[3]+.8]);} return l;}
function temEntrada(n){return n.tipo==="processo"||n.tipo==="cliente";}
var ultPorta=null;
function portaEm(x,y){
  for(var i=M.nos.length-1;i>=0;i--){var l=portas(M.nos[i]);
    for(var j=0;j<l.length;j++){var p=P(l[j][0],l[j][1],0); if(Math.hypot(x-p[0],y-p[1])<11){ultPorta=l[j];return M.nos[i];}}}
  return null;
}
function areaEm(wx,wy){
  for(var i=M.areas.length-1;i>=0;i--){var a=M.areas[i]; if(wx>=a.x&&wx<=a.x+a.w&&wy>=a.y&&wy<=a.y+a.h)return a;}
  return null;
}
function ligEm(x,y){
  var C=calc(),achou=null;
  M.ligacoes.forEach(function(l){var g=C.lig[l.id]; if(achou)return;

  r.push({q:"3. Onde usar fluxo contínuo?",ok:cont>0,
    t:cont?cont+" ligação(ões) entre processos em fluxo contínuo ou FIFO.":"Nenhuma ligação em fluxo contínuo ou FIFO. Avalie processos vizinhos com T/C parecido e próximo do takt."});
  r.push({q:"4. Onde usar supermercados puxados?",ok:M.ligacoes.length>0&&emp===0,
    t:sup+" supermercado(s). "+(emp?emp+" ligação(ões) ainda empurrada(s).":"Nenhuma ligação empurrada.")});
  var t5,ok5=false;

    ok5=!outros&&!ruim;

  return r;

  sortDraw(sc.bs);desenharFx(sc.fx);desenharRotulos(sc.bl,t);
  if(ui.edit)desenharEditor(C);
  requestAnimationFrame(frame);
}
